  button.rec{background:#E5484D;color:#fff;min-width:130px}button.stop{background:#222;color:#fff;border:1px solid #444}

  .rdot{display:inline-block;width:10px;height:10px;border-radius:50%;background:#E5484D;margin-right:6px;animation:b 1s infinite}
  @keyframes b{50%{opacity:.2}}
  .msg{position:fixed;top:42vh;left:16px;right:16px;font-size:15px;color:#ffb;text-align:center;text-shadow:0 1px 2px #000}

const $ = id => document.getElementById(id);
const v=$('v'), txt=$('txt'), au=$('au'), count=$('count'), msg=$('msg'), sel=$('part');
let stream, rec, chunks=[], blob=null, W=[], spans=[], cur=-1, LEAD=1.5, t0=null, live=false;
PARTS.forEach((p,i)=>{ const o=document.createElement('option'); o.value=i; o.textContent=p.title; sel.appendChild(o); });

function load(i){
  const p=PARTS[i]; W=p.words; au.src=p.audio; cur=-1;
  txt.innerHTML=''; spans=W.map(w=>{ const s=document.createElement('span'); s.textContent=w.w+' '; txt.appendChild(s); return s; });
  paint(-1); $('save').hidden=true; blob=null; live=false; $('play').textContent='▶ Écouter';
}
const idxAt=t=>{ let i=-1; while(i+1<W.length && W[i+1].s<=t) i++; return i; };
function paint(i){
  if(i===cur) return; cur=i;
  spans.forEach((s,k)=>s.className = k<i?'done':k===i?'now':k<=i+4?'next':'');
  const el=spans[Math.max(i,0)]; if(!el) return;
  // garder le mot courant vers le tiers haut de la zone de texte
  const box=txt.parentElement; const y=el.offsetTop - box.clientHeight*0.28;
  txt.style.transform='translateY('+(-Math.max(0,y))+'px)';
}
const mmss=t=>String(Math.floor(t/60)).padStart(2,'0')+':'+(t%60).toFixed(1).padStart(4,'0');
(function frame(){ paint(live ? idxAt(au.currentTime) : -1); $('tc').innerHTML=(rec&&rec.state==='recording'?'<span class="rdot"></span>':'')+mmss(au.currentTime); requestAnimationFrame(frame); })();

async function cam(){
  try{
    stream = await navigator.mediaDevices.getUserMedia({video:{facingMode:'user',width:{ideal:1080},height:{ideal:1920},frameRate:{ideal:30}},audio:true});
    v.srcObject=stream; msg.textContent='';
    const t=stream.getVideoTracks()[0].getSettings(); msg.textContent=t.width+'×'+t.height+' · '+(t.frameRate||'?')+' fps';
    setTimeout(()=>msg.textContent='',3000);
  }catch(e){ msg.textContent='Caméra refusée : '+e.name+' — Réglages Safari → Caméra/Micro → Autoriser'; }
  try{ await navigator.wakeLock.request('screen'); }catch(e){}
}
const beep=(f,d)=>{ const ctx=beep.ctx??=new (window.AudioContext||window.webkitAudioContext)(); const o=ctx.createOscillator(), g=ctx.createGain(); o.frequency.value=f; g.gain.value=.2; o.connect(g).connect(ctx.destination); o.start(); o.stop(ctx.currentTime+d); };
const sleep=ms=>new Promise(r=>setTimeout(r,ms));

async function start(){
  if(!stream){ await cam(); if(!stream) return; }
  await au.play(); au.pause(); au.currentTime=0;                     // déverrouille l'audio sur le geste
  const mime=['video/mp4;codecs=avc1','video/mp4','video/webm;codecs=vp9','video/webm'].find(m=>window.MediaRecorder&&MediaRecorder.isTypeSupported(m))||'';
  chunks=[]; rec=new MediaRecorder(stream, mime?{mimeType:mime,videoBitsPerSecond:8e6}:{videoBitsPerSecond:8e6});
  rec.ondataavailable=e=>{ if(e.data.size) chunks.push(e.data); };
  rec.onstop=()=>{ live=false; blob=new Blob(chunks,{type:rec.mimeType||'video/mp4'}); $('save').hidden=false; $('go').hidden=$('play').hidden=false; $('stop').hidden=true; sel.hidden=false; msg.textContent='Prise terminée : '+(blob.size/1e6).toFixed(1)+' Mo. Enregistrer → Photos ou Fichiers.'; };
  rec.start(1000); t0=performance.now();
  $('go').hidden=$('play').hidden=true; $('stop').hidden=false; sel.hidden=true;
  count.hidden=false;
  for(const n of [3,2,1]){ count.textContent=n; beep(n===1?1320:880,.12); await sleep(1000); }
  count.textContent='GO'; count.style.color='#1F9D55'; await sleep(LEAD*1000); count.hidden=true; count.style.color='';
  window.__audioStartMs = Math.round(performance.now()-t0);                // décalage voix / début d'enregistrement
  au.currentTime=0; live=true; au.play();
}
au.onended = async () => { if(rec&&rec.state==='recording'){ await sleep(1500); rec.stop(); } else { live=false; $('play').textContent='▶ Écouter'; } };
// écoute seule : texte + voix, sans caméra ni enregistrement — pour répéter avant la prise
$('play').onclick=async()=>{ if(live){ au.pause(); live=false; $('play').textContent='▶ Écouter'; return; }
  au.currentTime=0; live=true; $('play').textContent='■ Stop'; await au.play(); };
$('stop').onclick=()=>{ au.pause(); if(rec&&rec.state==='recording') rec.stop(); };
$('reset').onclick=()=>{ live=false; au.pause(); $('play').textContent='▶ Écouter'; au.currentTime=0; cur=-2; paint(-1); count.hidden=true;
  if(rec&&rec.state==='recording'){ rec.onstop=null; rec.stop(); } blob=null; chunks=[];
  $('save').hidden=true; $('stop').hidden=true; $('go').hidden=$('play').hidden=false; sel.hidden=false; msg.textContent=''; };
$('go').onclick=start;
$('save').onclick=async()=>{
  const ext=(rec.mimeType||'').includes('mp4')?'mp4':'webm';
  const name=PARTS[sel.value].file+'_voix'+(window.__audioStartMs||0)+'ms.'+ext;
  // hébergé en artifact claude.ai : la sauvegarde passe par la capacité downloads (une page n'a pas le droit de télécharger seule)
  const dl = window.claude && window.claude.use ? await claude.use('downloads') : null;
  if(dl){ try{ await dl.save({filename:name, data:blob}); msg.textContent='Enregistré : '+name; }catch(e){ msg.textContent='Sauvegarde : '+(e&&e.code||e); } return; }
  const file=new File([blob],name,{type:blob.type});
  if(navigator.canShare && navigator.canShare({files:[file]})){ try{ await navigator.share({files:[file],title:name}); return; }catch(e){} }
  const a=document.createElement('a'); a.href=URL.createObjectURL(blob); a.download=name; a.click();
};
$('sz').onclick=()=>{ const s=parseInt(getComputedStyle(document.documentElement).getPropertyValue('--size'))||27; document.documentElement.style.setProperty('--size',(s>=36?22:s+3)+'px'); };
sel.onchange=()=>{ load(+sel.value); $('go').hidden=$('play').hidden=false; $('stop').hidden=true; sel.hidden=false; };
load(0); cam();
</script></body></html>
